name: Decode email assets
on:
  push:
    paths:
      - "intro/*.b64"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          set -euo pipefail
          mkdir -p intro
          base64 -d intro/ai.jpg.b64 > intro/ai.jpg
          base64 -d intro/mail.jpg.b64 > intro/mail.jpg
          base64 -d intro/pick.gif.b64 > intro/pick.gif
          file intro/ai.jpg intro/mail.jpg intro/pick.gif
      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intro/ai.jpg intro/mail.jpg intro/pick.gif
          if git diff --staged --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Decode intro email images"
          git push
